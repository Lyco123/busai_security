<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN 数据解码器</title>
    <style>
        /* 可选：美化列表样式 */
        #can-data-list {
            list-style-type: none; /* 去除默认圆点 */
            padding: 0;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 300px;
        }
        #can-data-list li {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        #can-data-list li:last-child {
            border-bottom: none;
        }
        #can-data-list li strong {
            color: #333;
            margin-right: 10px;
        }
        #output {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
  <form id="form-can">
      <!-- 改为列表结构 -->
      <ul id="can-data-list">
          <li id="module-item">
              <strong>任务模块:</strong>
              <span id="can">{{ logs.module_name }}</span>
          </li>
          <li id="caludate-item">
              <strong>计算日期:</strong>
              <span id="obuid">{{ logs.calculate_date }}</span>
          </li>
          <li id="starttime-item">
              <strong>计算开始时间:</strong>
              <span id="reporttime">{{ logs.start_time }}</span>
          </li>
          <li id="endtime-item">
              <strong>计算结束时间:</strong>
              <span id="ppartition">{{ logs.end_time }}</span>
          </li>
          <li id="remark-item">
              <strong>备注:</strong>
              <span id="ppartition">{{ logs.remark }}</span>
          </li>
      </ul>

      <div id="output"></div>
  </form>
</body>
</html>
