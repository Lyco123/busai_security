version: '3.8'

services:
  ocr-service:
    build: .
    container_name: ocr-service
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_FILE_MB=50
      - MAX_PAGES=100
      - PDF_DPI=200
      - OCR_TIMEOUT_SECONDS=60
      - OCR_MAX_CONCURRENCY=2
      - OCR_WORKER_BOOT_TIMEOUT_SECONDS=120
      - OCR_PROCESS_TERMINATE_GRACE_SECONDS=2
      - USE_GPU=false
      - PADDLEOCR_LANG=ch
      - LOG_LEVEL=INFO
    volumes:
      - ./temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
